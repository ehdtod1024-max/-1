<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A2O 길드 자료실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Cpath d=%22M24 3 L42 10 V24 C42 35 34 42 24 45 C14 42 6 35 6 24 V10Z%22 fill=%22%2308394a%22 stroke=%22%23e2335a%22 stroke-width=%223%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday guild handbook: playful like the game, tidy like a reference book
   IDEA Trickster's lilac item window + the treasure route around Caballa Island
   PICTURE sea band with the island route (regions as map stations); lock screen island scene
   COLOUR sand ground, deep sea header, turquoise route band, coral accent, lilac windows
   TYPE Jua display + IBM Plex Sans KR text
   LAYOUT sticky header with search / route band / tab row / one content column up to 1240px; stacks on phone */
:root{color-scheme:light dark;--bg:light-dark(#fffaf0,#0a1a21);--ink:light-dark(#142229,#e4f0f2);--mut:light-dark(#566870,#9ab2b9);--line:light-dark(#e7dfcd,#20414c);--panel:light-dark(#ffffff,#0f2730);--lil:light-dark(#f3ecff,#182544);--lilb:light-dark(#d9c9fb,#34437a);--deep:light-dark(#08394a,#06232e);--sea:light-dark(#0d93aa,#0b6d80);--sea2:light-dark(#43c3d4,#14899c);--coral:light-dark(#e2335a,#ff6d87);--hl:light-dark(#fff1c7,#3a3313);--ok:light-dark(#1d8a5b,#4fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{scroll-padding-top:130px}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.disp{font-family:Jua,"IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1.1;margin:0}
h2{font-size:clamp(26px,3.4vw,36px)}h3{font-size:21px;margin-top:6px}
a{color:var(--sea)}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding-inline:max(16px,4vw)}
[hidden]{display:none!important}
.win{background:var(--lil);border:2px solid var(--lilb);border-radius:16px;box-shadow:0 10px 0 rgba(0,0,0,.08);overflow:hidden}
.win>.bar{background:var(--coral);color:#fff;font-family:Jua,sans-serif;font-size:18px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.win>.bar i{display:inline-flex;gap:5px;font-style:normal}.win>.bar i b{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.75)}
.win>.in{padding:18px}
.btn{border:0;border-radius:12px;background:var(--coral);color:#fff;font-weight:700;min-height:46px;padding:0 18px}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#eaf7f9}
.top .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"b s";align-items:center;gap:8px 14px;min-height:64px;padding-block:8px}
.top .brand{grid-area:b}.top .search{grid-area:s}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.brand b{font-family:Jua,sans-serif;font-size:24px;font-weight:400;white-space:nowrap}
.brand small{display:block;font-size:13px;opacity:.75;line-height:1.1}
.search{position:relative}
.search input{width:100%;background:#fff;color:#142229;border:0;padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:18px;height:18px;color:#566870}
/* route band */
.route{background:linear-gradient(180deg,var(--sea) 0%,var(--sea2) 100%);color:#fff;position:relative}
.route .wrap{padding-block:18px 22px}
.route h2{font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.route h2 span{font-family:"IBM Plex Sans KR",sans-serif;font-size:14px;opacity:.85}
.stations{display:flex;gap:0;overflow-x:auto;padding:14px 4px 6px;scrollbar-width:thin}
.st{flex:none;width:76px;display:grid;justify-items:center;gap:6px;background:none;border:0;color:#fff;padding:0;position:relative}
.st::before{content:"";position:absolute;top:22px;left:-50%;width:100%;border-top:3px dashed rgba(255,255,255,.55);z-index:0}
.st:first-child::before{display:none}
.st .dot{width:46px;height:46px;border-radius:50%;background:#fffaf0;color:#08394a;display:grid;place-items:center;font-weight:700;font-size:14px;position:relative;z-index:1;box-shadow:0 4px 0 rgba(0,0,0,.18);border:3px solid #fff}
.st .nm{font-size:13px;line-height:1.25;text-align:center;font-weight:600;text-wrap:balance}
.st.on .dot{background:var(--coral);color:#fff;border-color:#ffd6de;transform:scale(1.08)}
.st:hover .dot{transform:translateY(-2px)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:thin}
.tab{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:0 15px;min-height:42px;font-weight:600;font-size:15px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding-bottom:56px}
.sec{margin-top:22px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.lead{color:var(--mut);margin:6px 0 0;max-width:70ch}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.card h4{margin:0 0 4px;font-size:17px}
.card .meta{color:var(--mut);font-size:14px}
.chip{display:inline-block;background:var(--coral);color:#fff;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.sea{background:var(--sea)}.chip.soft{background:var(--lil);color:var(--ink);border:1px solid var(--lilb)}
.notes{margin:0;padding-left:20px}.notes li{margin:4px 0}
.src{font-size:13px;color:var(--mut);margin-top:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:0 14px;min-height:40px;font-weight:600}
.pill.on{background:var(--coral);border-color:var(--coral);color:#fff}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--mut);font-weight:600;background:color-mix(in srgb,var(--lil) 55%,transparent);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.it{font-weight:700}
.cur{background:var(--hl)}
.done td{opacity:.45;text-decoration:line-through}
.mut{color:var(--mut)}
.qcard{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.qcard .qh{padding:10px 14px;background:var(--lil);border-bottom:1.5px solid var(--lilb);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qcard .qh b{font-size:16px}
.qcard .qb{padding:10px 14px}
.qcard ul{margin:0;padding-left:18px}
.rw{font-size:14px;margin-top:6px}
details{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);margin-top:10px}
details>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details>summary::after{content:"+";font-family:Jua,sans-serif;font-size:20px;line-height:1}
details[open]>summary::after{content:"–"}
details>.db{padding:0 14px 14px}
.steps{margin:0;padding-left:22px}.steps li{margin:6px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.filters input{flex:1 1 220px}
.res h3{display:flex;gap:8px;align-items:center}
.hit{padding:10px 0;border-bottom:1px solid var(--line)}
.hit:last-child{border-bottom:0}
.hit .t{font-weight:700}
.hit a{cursor:pointer}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px}
.daily-list{display:grid;gap:8px}
.dq{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
.dq input{width:22px;height:22px;min-height:0}
.dq .lv{font-family:Jua,sans-serif;font-size:20px;color:var(--sea);min-width:3.2em}
.dq.is-done{opacity:.5}
.dq .need{font-weight:700}
.dq .from{font-size:14px;color:var(--mut)}
.dq .tm{font-size:13px;white-space:nowrap;color:var(--mut);text-align:right}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0}
.kv dt{font-weight:700}.kv dd{margin:0}
.empty{padding:20px;text-align:center;color:var(--mut)}
.nw{white-space:nowrap}.ml{display:none}
.more{display:block;margin:12px auto 0}
footer{border-top:1.5px solid var(--line);padding-block:18px;color:var(--mut);font-size:14px}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.brand small{display:none}.brand b{font-size:20px}.brand svg{width:30px;height:30px}.top .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"b" "s";min-height:0}.st{width:72px}h2{font-size:26px}
.itm thead,.mon thead{display:none}.itm tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 10px;border-bottom:1px solid var(--line)}.itm td,.mon td{border:0;padding:0}.itm td:nth-child(3){grid-column:2;grid-row:1;text-align:right}.itm td:nth-child(2),.itm td:nth-child(4),.itm td:nth-child(5){grid-column:1/-1;font-size:14px}.itm td:nth-child(2)::before{content:"획득 ";color:var(--mut)}.itm td:nth-child(4)::before{content:"위치 ";color:var(--mut)}.itm td:empty{display:none}
.mon tr{display:flex;flex-wrap:wrap;gap:2px 12px;padding:9px 10px;border-bottom:1px solid var(--line)}.mon td{font-size:14px}.mon td:nth-child(1){flex-basis:100%;font-size:16px}.mon td:nth-child(8),.mon td:nth-child(9){flex-basis:100%}.mon td.n{text-align:left}.mon td:empty{display:none}.ml{display:inline;color:var(--mut)}
table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding:8px 10px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--mut);font-weight:600;text-align:left;flex:none;max-width:45%}.stack td.it{font-size:16px}.stack td:empty{display:none}
.dq{grid-template-columns:auto minmax(0,1fr)}.dq .tm{grid-column:2;text-align:left}}
@media(prefers-reduced-motion:no-preference){.st .dot{transition:transform .18s}}
/* ===== additions: header actions, pictures, 내 퀘스트 tracker, modal ===== */
.top .wrap{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"b s a"}
.top .acts{grid-area:a;display:flex;gap:6px;align-items:center}
.hb{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#eaf7f9;border-radius:12px;min-height:44px;padding:0 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px}
.hb:hover{background:rgba(255,255,255,.12)}
.hb .n{background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;min-width:22px;text-align:center;line-height:1.4}
.hb.gear{width:44px;justify-content:center;padding:0;font-size:20px}
.tab .tn-n{display:inline-block;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:0 6px;margin-left:2px}
.tab.on .tn-n{background:var(--bg);color:var(--ink)}
a.pill{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.pill .pn{font-weight:400;opacity:.7;font-size:13px;margin-left:2px}
.pills.sub{margin-bottom:4px}
.lnk{display:inline-flex;align-items:center;text-decoration:none}
/* pictures */
.pic{width:30px;height:30px;object-fit:contain;flex:none;display:inline-block;vertical-align:middle;border-radius:7px}
.pic.ph{display:inline-grid;place-items:center;background:var(--lil);border:1px solid var(--lilb);color:var(--mut);font-size:12px;font-weight:700;line-height:1;font-family:Jua,sans-serif}
.pic.ph.km{background:color-mix(in srgb,var(--coral) 12%,var(--panel));border-color:color-mix(in srgb,var(--coral) 35%,transparent)}
.pic.ph.kn{background:color-mix(in srgb,var(--sea) 14%,var(--panel));border-color:color-mix(in srgb,var(--sea) 40%,transparent)}
.pic.sm{width:22px;height:22px;font-size:10px;border-radius:5px}
.pic.md{width:48px;height:48px;font-size:16px;border-radius:10px}
.pic.lg{width:120px;height:120px;font-size:34px;border-radius:16px}
img.pic.lg{background:color-mix(in srgb,var(--lil) 70%,transparent);padding:6px}
.pic.gi{font-family:inherit;font-size:22px}
.ico{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.mrow{display:flex;gap:10px;align-items:center}
.ent{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;font-weight:inherit;cursor:pointer;text-align:left;border-bottom:1px dotted color-mix(in srgb,currentColor 50%,transparent);line-height:inherit}
.ent:hover{color:var(--sea);border-bottom-color:var(--sea)}
.ent.ttl{font-weight:700;font-size:16px}
.ent.t{font-weight:700}
/* headings with a button on the right */
.h3row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.h3row .hr{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.qb{border:1.5px solid var(--coral);color:var(--coral);background:var(--panel);border-radius:999px;padding:0 13px;min-height:36px;font-weight:700;font-size:14px;white-space:nowrap}
.qb:hover{background:color-mix(in srgb,var(--coral) 10%,var(--panel))}
.qb.on{background:var(--coral);color:#fff}
.qcard .qh{align-items:center}
.qcard.live{border-color:var(--coral)}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
/* daily checklist with portraits */
.dq{grid-template-columns:auto auto minmax(0,1fr) auto}
.dqp:empty{display:none}
.dq .need .ico{margin:2px 0}
.win>.bar .rst{font-family:"IBM Plex Sans KR",sans-serif;font-size:13px;opacity:.9;white-space:nowrap}
.card.rep{position:relative}
.card.rep .rl{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-bottom:4px}
.card.rep .rl input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px;accent-color:var(--ok)}
.card.rep.is-done{opacity:.55}.card.rep.is-done .rl b{text-decoration:line-through}
.dq input{accent-color:var(--ok)}
/* tracker card */
.tq{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.tq+.tq{margin-top:12px}
.mini-list{display:grid;gap:10px}
.tq.done{border-color:var(--ok)}
.tq.inline{border-color:var(--coral)}
.tqh{padding:12px 14px;background:var(--lil);border-bottom:1.5px solid var(--lilb);display:grid;gap:8px}
.tqh.in{padding:8px 14px}
.tqt{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tqt>b{font-size:17px}
.tq.mini .tqt>b{font-size:16px}
.pg{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;min-width:60px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--ok));border-radius:inherit}
.pgt{font-size:14px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.okt{color:var(--ok)}
.tqi{list-style:none;margin:0;padding:2px 0}
.ti{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);transition:opacity .2s}
.ti:last-child{border-bottom:0}
.ti.step{grid-template-columns:auto minmax(0,1fr) auto}
.ti .ck{display:grid;place-items:center;min-width:28px;min-height:28px}
.ti .ck input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--ok);cursor:pointer}
.ti .tp:empty{display:none}
.ti .tn{display:grid;gap:2px}
.ti .tn>.ent,.ti .tn>.stp{font-weight:700;justify-self:start}
.ti .stp{font-weight:600}
.ti .tm{font-size:13px;color:var(--mut)}
.ti.off{opacity:.42}
.ti.off .tn>.ent,.ti.off .tn>.stp{text-decoration:line-through}
.ti.pv .ck{color:var(--mut);font-weight:700}
.cnt{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap}
.sq{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;min-width:36px;min-height:36px;font-weight:700;padding:0 6px;font-size:16px}
.sq:hover{border-color:var(--sea)}
.sq.per{color:var(--sea);border-color:var(--sea);font-size:14px}
.nm{width:66px;min-height:36px;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.of{color:var(--mut);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tqf{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between;padding:10px 14px;border-top:1.5px solid var(--line);font-size:14px}
.tqf>div:first-child{flex:1 1 260px}
.tqf .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qn{margin:2px 0;color:var(--mut);font-size:14px}
.qmore{margin:0;padding:8px 14px;font-size:14px;color:var(--mut);border-top:1px dashed var(--line)}
.tb{border:1.5px solid var(--line);background:var(--panel);color:inherit;border-radius:10px;min-height:38px;padding:0 11px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
.tb:hover{border-color:var(--sea)}
.tb.warn{color:var(--coral);border-color:var(--coral)}
.tb.go{background:var(--ok);border-color:var(--ok);color:#fff}
.filebtn{position:relative;overflow:hidden;cursor:pointer}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:4px 0 12px}
.toolbar .sp{flex:1}
.tg{display:inline-flex;gap:6px;align-items:center;font-size:15px;cursor:pointer;min-height:38px}
.tg input,.filters .tg input{width:20px;height:20px;min-height:0;flex:0 0 auto;accent-color:var(--sea)}
.filters .tg{flex:0 0 auto}
.empty-my p{margin:0 0 10px}
/* quest picker */
.fq{display:grid;gap:10px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel)}
.fr.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 5%,var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ic{display:inline-flex;align-items:center;gap:4px;font-size:13px;background:var(--lil);border:1px solid var(--lilb);border-radius:999px;padding:2px 9px 2px 4px;color:inherit}
button.ic{cursor:pointer;font:inherit;font-size:13px}
.hit .fr{border:0;padding:0;background:none}
.cu{display:grid;gap:8px;max-width:560px}.cu label{font-weight:700;font-size:14px}
textarea{width:100%;font:inherit;font-size:15px;background:var(--panel);color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;resize:vertical}
/* farming */
.fg{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.fg+.fg{margin-top:12px}
.fgh{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--lil);border-bottom:1.5px solid var(--lilb)}
.fgh .fgt{flex:1}
/* modal */
.ov{position:fixed;inset:0;background:rgba(6,20,26,.55);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);color:var(--ink);border-radius:18px;max-width:720px;width:100%;max-height:min(90vh,940px);overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35);overscroll-behavior:contain}
.sheet .x{position:sticky;top:10px;float:right;margin:10px 10px 0 0;width:44px;height:44px;border-radius:50%;border:0;background:var(--lil);color:var(--ink);font-size:26px;line-height:1;z-index:2}
.sb{padding:20px 20px 24px}
.sb h2{font-size:28px}
.sb h3{font-size:19px}
.ent-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding-right:44px}
.credit{font-size:12.5px;color:var(--mut);margin:8px 0 0}
body.modal-open{overflow:hidden}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:min(92vw,560px);box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.totop{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:0;background:var(--deep);color:#fff;font-size:20px;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.25)}
@media(max-width:900px){.cards.wide{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){
  .top .wrap{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"b a" "s s"}
  .hb{padding:0 10px;font-size:14px}
  .dq{grid-template-columns:auto auto minmax(0,1fr)}.dq .tm{grid-column:3;text-align:left}
  .ti{grid-template-columns:auto auto minmax(0,1fr);row-gap:6px}.ti .cnt{grid-column:1/-1;justify-self:end}
  .ti.step{grid-template-columns:auto minmax(0,1fr)}
  .fr{grid-template-columns:minmax(0,1fr)}.fr>.qb{justify-self:start}
  .ov{place-items:end center;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:92vh}
  .sb{padding:16px 16px 28px}.pic.lg{width:88px;height:88px}
  .toolbar .sp{display:none}
}
@media(prefers-reduced-motion:no-preference){.pbar>i{transition:width .25s}}

 4,975,350. 아이템: 환영의 리페어 가루 1(Neo·마을 장비 수리), 음기의 결정 7.","cr100":[["주석·자수정·유황·마노·납·벽옥·연철·묘안석·강철·쿤차이트 원석","음기의 결정 1개씩"],["백은·터키석·탄탈·오팔·티타늄·금록석 원석","음기의 결정 2개씩"],["지하/바다/동굴/관 속 마녀의 빗자루","음기의 결정 56개씩"]],"darklord":"다크로드 전직용 '몽마'는 환영학원 입구 '겁쟁이수위 크레이븐'과 대화하면 바로 이동할 수 있습니다."},"tartarus":{"intro":["Lv.260부터 메갈로폴리스 광장 노숙자 이안(상점 쪽 분수대 앞) → '다른 소문이 있는지 묻는다' → '새로운 개발실에 대해' → 5,000 겔더로 [공사 사무소] 입장.","입장 퀘스트 완료 보상: 에너지 드링크 20개(HP/MP 5000 회복, 무게 1), 신의 기름 단지 1개.","탈타로스 안에서는 일반 장비 능력치가 깎입니다: B1·B2 10%, B3 50%, B4 90%. 탈타로스 장비를 소울 장비로 올리면 패널티가 없습니다.","땅 깊이 300m, 땅 속성 인공(돌). 발굴 가능한 모든 곳에서 500겔더 쿠폰·하르콘·레시피 등이 나옵니다."],"entry":[["노숙자 이안","공사 사무소 입장 (Lv.260+, 5,000 겔더)"],["개발PM L씨","개발자 J·K·H씨의 보고서 받아오기"],["개발자 J씨","개발자 K씨에게 문서에 대해 묻기"],["개발자 K씨","컨텐츠 컨셉 스케치 1·2·3 각 1개 — 공사 사무소 지하 던전 발굴"],["개발자 J씨","개발자 H씨에게 컨텐츠 설계도 받아오기"],["개발자 H씨","동굴 우파루파 처치 → 우파루파 꼬리·아가미·테스트용 더미 각 10개 (공사 사무소 지하 던전)"],["개발PM L씨","돈 주반니 찾기 — L씨와 다시 대화"],["바위의 틈","공사 사무소 지하 던전 B2 왼쪽, 끝의 문 조사"],["제어실 출입문","스킬라 처치 → '의심스러운 ID 카드' 소지 상태로 클릭"],["오래된 제어 장비","대화 후 사무실로 이동, L씨 퀘스트 완료"],["돈 주반니","장치 안쪽 조사 → 완료. 사무실 '의문의 장치'로 탈타로스 입구 이동"]],"pass":[["간수장 오케아","'탈타로스에 출입한다' — 신의 허가서 필요"],["커플매니저 큐- 군","신의 기름 단지 1개 → 신의 허가서 (단지는 망가진 스킬라 처치 또는 공사 사무실 티프몽 50,000 겔더)"],["탈타로스 문","강철신의 케이지 → 코이오스 / 고대신의 케이지 → 진 크로노스. 케이지 선택창에서 취소하면 허가서가 사라지니 주의"]],"koios":"강철신의 케이지(B1·B2): 퀘스트 없이 길만 찾으면 됩니다. B1: 제어 장치 A → Cage 6 → Cage 16 → 틈 → 틈 → 제어 장치 B. B2: 제어 장치 A → Cage 1 → 11 → 21 → 틈 → 틈 → 제어 장치 B로 보스방. 외우기: B1 [오른쪽-오른쪽-틈-틈], B2 [왼쪽-왼쪽-왼쪽-틈-틈]. 코이오스 Lv.650.","robin":[["월","Cage 8"],["화","Cage 6"],["수","Cage 11"],["목","Cage 9"],["금","Cage 7"],["토","Cage 12"],["일","Cage 19"]],"gates":[["킹 포푸리 (B3 Cage 1)","제1관문 도전 자격시험: 고신류 게이저'진(Lv.618) 20분 내 1마리 (B3 Cage 4·6·9·11·14·16)","제1관문 감옥열쇠 + 제8관문 열쇠 재료1 1~3개"],["제1관문 포푸리","고신류 드래곤(Lv.770) 20분 내 1마리","제1관문 자격증명서 → 등록기에 등록"],["킹 포푸리","제3관문 자격시험: 고신류 해적의 쇠사슬 3(Cage 2·3·5·7·8) · 고신류 비탈리터의 배기통 3(Cage 10·12·13·15) · 고신류 가디언의 족쇄 3(Cage 17·18·19)","제3관문 감옥열쇠 + 재료2 1~3개"],["제3관문 포푸리","고신류 시시포스(Lv.770) 20분 내 1 :"1차 전직 뱃지","lv":"60","how":"카붐(까발라 지하던전4, Lv.80) 드랍. 캐릭터별 뱃지, 거래 가능.","src":"cafe_job"},{"name":"포푸리 장비","lv":"30~","how":"포푸리털을 메갈로폴리스 숲길-남동 민트에게 힘의 엘릭서로 교환 → 일반 포푸리 장비를 상위 장비로 조합.","src":"tot_fur"},{"name":"인디아나 수렵총","lv":"40~","how":"포푸리 동굴 필드5 인디아나 존 퀘스트 마지막 보상.","src":"cafe_poppuri"},{"name":"트릭스터의 반지","lv":"235~","how":"타바스코 키 퀘스트 연계: 절대 반지(불렘) → 미완된 → 연마된(파이어 볼 2) → 헌터의 증서와 함께 트릭스터의 반지. 슬롯·옵션 랜덤.","src":"cafe_taba"},{"name":"지역(Neo·마을) 장비","lv":"~230","how":"상점·지역 보상 장비. 보통 스노우힐 세트까지 쓰고 230 무렵부터 이계·진혼 장비로 넘어갑니다(커뮤니티). 환영의 리페어 가루로 수리 가능.","src":"arca_230"},{"name":"이계의 플래시뱃 (검·투구·방패·지팡이·링)","lv":"200","how":"제련 광물이 티타늄이라 비싼 편. 공캐는 플래시뱃 검·투구, 투구에 토속저항 성조 가능. 방패·지팡이는 진혼 쪽이 더 좋다는 평.","src":"arca_230"},{"name":"진혼 장비 (수정방패·소울스틱·시커 등)","lv":"230","how":"혼돈의 탑 알바생 정수 퀘스트 보상 코드 S(무기)·A(투구)·B(방패). 진혼의 수정방패는 기방 최대 1012, 3구 이상 + 기방 800↑면 7~8제해서 사용 추천. 마캐 무기는 진혼의 소울스틱, 공캐는 진혼의 시커도 대안.","src":"arca_230"},{"name":"스틸 장비 → 소울 스틸","lv":"320","how":"탈타로스 B1·B2 코이오스 등에서 낮은 확률 드랍. 소울 장비로 올리면 탈타로스 능력치 패널티 없음.","src":"hepa_soul"},{"name":"크로노 장비 → 소울 크로노","lv":"380","how":"9관문 크로노스·10관문 진 크로노스 드랍.","src":"hepa_soul"}],"soul":{"rule":"제작 재료: 베이스 장비 1개 + 영혼 5개 + 나머지 재료 각 50개. 소울 포션이 제작·강화·충전에 필요합니다. 소울 강화는 11단계까지 (유지시간 증가).","steel":[["소울 스틸블러드(검)","스틸블러드","탈타로스 파편 1 · 파편 5 · 바위 파편 1","코이오스의 영혼 1"],["소울 스틸본로드(지팡이)","스틸본로드","파편 1 · 파편 6 · 바위 파편 2","코이오스의 영혼 2"],["소울 스틸플래시(총)","스틸플래시","파편 1 · 파편 4 · 운명의 수레바퀴 1","코이오스의 영혼 3"],["소울 스틸스컬러(해머)","스틸스컬러","파편 1 · 파편 7 · 운명의 수레바퀴 2","코이오스의 영혼 4"],["소울 스틸아멧(모자)","스틸아멧","파편 2 · 파편 8 · 지저의 핵","코이오스의 영혼 5"],["소울 스틸필드(방패)","스틸필드","파편 3 · 파편 9 · 증식 세포","코이오스의 영혼 6"],["소울 스틸콜렉터(악세서리)","스틸콜렉터","파편 10 · 광원 · 검은 기운","코이오스의 영혼 7"]],"chrono":[["소울 크로노블러드","크로노블러드","파편 1K · 5K · 바위 파편 1K","크로노스의 영혼 1"],["소울 크로노본로드","크로노본로드","파편 1K · 6K · 바위 파편 2K","크로노스의 영혼 2"],["소울 크로노플래시","크로노플래시","파편 1K · 4K · 운명의 수레바퀴 1K","크로노스의 영혼 3"],["소울 크로노스컬러","크로노스컬러","파편 1K · 7K · 운명의 수레바퀴 2K","크로노스의 영혼 4"],["소울 크로노아멧","크로노아멧","파편 2K · 8K · 증식 세포K","크로노스의 영혼 5"],["소울 크로노필드","크로노필드","파편 3K · 9K · 지저의 핵K","크로노스의 영혼 6"],["소울 크로노콜렉터","크로노콜렉터","파편 10K · 광원K · 검은 기운K","크로노스의 영혼 7"]],"enhance":"강화 재료 — 소울 스틸: 탄탈로스 과실·탄탈로스 가지·코이오스의 영혼 / 소울 크로노: 탄탈로스 과실K·가지K·크로노스의 영혼. 단계가 높을수록 과실·가지가 더 필요합니다.","potion":["마이뷰 수호자 메뉴 '소울 관리'에 수호자의 근원(알 수 없는 광석·그림자의 조각·푸른빛의 보석)을 등록하면 15분마다 소비되며 게이지가 찹니다 (로그아웃 중에도).","게이지 증가(대략): 알 수 없는 광석 25% · 그림자의 조각 60% · 푸른빛의 보석 75% · 근원이 없으면 -10%.","게이지가 다 차면 소울 포션 생성: 로그인 중 5개, 로그아웃 중 1개.","교환 NPC 안타레스: 그림자의 조각 1 = 알 수 없는 광석 3, 푸른빛의 보석 1 = 그림자의 조각 5."],"anvil":[["1","소울 스틸블러드·스틸본로드 제작 가이드","탈타로스 파편 1, 5, 6 · 바위 파편 1, 2 (각 3개)"],["2","소울 스틸플래시·스틸스컬러 제작 가이드","탈타로스 파편 1, 4, 7 · 심판의 수레바퀴 1, 2 (각 3개)"],["3","소울 스틸아멧·스틸필드 제작 가이드","탈타로스 파편 2, 3, 8, 9 · 지저의 핵 · 증식 세포 (각 3개)"],["4","소울 스틸콜렉터 제작 가이드","탈타로스 파편 10 · 광원 · 검은 기운 (각 3개)"]]},"guides":[{"t":"1~230레벨 진행 루트","src":"arca_1_230","p":["키 퀘스트와 에피소드 퀘스트를 같이 하며 올립니다. 키 퀘스트만 하면 닐스 야영지까지 해도 다음 키퀘 제한(230)에 못 미쳐 뜹니다.","사냥만으로 올리는 건 효율이 낮습니다. TM 레벨은 120 또는 180부터 드릴군 + 그 레벨대 탱크드릴로 주력 스킬 마스터까지 먼저 올리는 것을 추천 (총 감지력 90 이상, 드릴군 100 준비).","메갈로폴리스 티프몽 판매 품목 중 '얼음 드릴'은 늪지대 필드까지 쓸 수 있는 가성비 드릴입니다."]},{"t":"돈 문제 해결 (초중반)","src":"arca_1_230","p":["1차 전직 30만 겔더는 퀘스트 아이템을 사지 않으면 자연히 모입니다.","2차 전직 300만 겔더는 로즈가든 화원 퀘스트 보상 '관 속 마녀의 빗자루' 3개를 유저에게 팔면 마련됩니다.","하르콘은 사지 말고 스노우힐~타바스코 광산 막스 퀘스트 5회 보상으로 (경험치도 줌).","카드 파밍: 노라 하수관 노라 비그 고정 젠존이나 코라비치 배드퓨리 존에서 몬스터 카드를 모아 카드식별 하는 유저에게 판매.","각성용 시크릿 카드 세트는 카드식별로 직접 모으거나 구매. 각성 후 심안으로 령 몬스터를 사냥하면 수입이 좋아집니다."]},{"t":"230~400레벨 진행","src":"arca_230","p":["230 타바스코 키퀘를 마치면 테마탕은 어려우니 혼돈의 탑 입장 퀘스트 후 등반이 일반적입니다.","각성 후 령퀘는 매일 꾸준히 — 경험치가 큽니다. 별점이 3장인 날은 드롭 카드를 붙이고 령사(령 몬스터 사냥)를 하세요.","광산 파티 퀘스트(스노우힐 200 · 테치치 230 · 타바스코 260)가 시간 대비 경험치가 매우 좋습니다. 보통 5인팟, 첫 판·마지막 판은 6인.","피에스타는 원킬이 나는 스펙일 때 참여하세요. 몬스터가 한 방에 안 죽으면 강한 스킬(마법 봉인 30초 등)을 씁니다.","키퀘·파티퀘·혼탑 정복·령퀘를 매일 하면 320은 넘고, 이후는 일일 퀘스트로 꾸준히 올립니다."]},{"t":"퀘스트 효율 체크","src":"arca_eff","p":["테마탕 4층 조합 퀘스트(번데기탕 10개)는 재료 시세 대비 경험치가 62층 정수 퀘스트보다 훨씬 비쌉니다 — 효율상 비추천.","에피소드 보너스의 '개발자 사진 2호' 퀘스트는 장당 시세가 매우 비싸 비추천."]},{"t":"알아두면 좋은 것","src":"arca_tip","p":["중간 장비는 직접 만드는(직작) 쪽이 대체로 쌉니다. 방패는 230제 진혼의 수정방패를 직접 만들어 보는 것을 추천.","경매장이 없고 시세 기능은 업데이트마다 초기화되니 참고만.","파티 버그: 처음 파티를 만들 때 레벨 차이 50 이상이면 '경험치 분배 없음'이 안 눌리는 경우, 파티 경험치 보너스가 가끔 사라지는 경우가 있습니다 (포탈 왕복으로 해결)."]}],"spirit":[["코라비치(블루밍)","필드3 (블루펭귄·티프몽) 또는 동굴길1 (애닥스) + 필드1 왼쪽 섬"],["데저트해안","피라미드 던전3 (미라·실버G·골드G) 또는 던전2 (이시스·네프시스)"],["포푸리 동굴","터비가 있는 곳 (포푸리 동굴4)"],["까발라 유적지","나뭇잎새"],["웁스부두","인어궁전 던전1 (어두움) + 동굴길2 (해적단)"],["고스트블루","필드4 (해적유령·세이레메이드)"],["로즈가든","필드4 (야수 빈센또), 뱀프 던전 (나이트)"],["늪지대","던전3 (코브라플라워·투쓰플라워) + 필드6 (머드 빅풋)"],["스노우힐","블루아이스 던전1·2 (심안 켜면 몬스터가 많음)"],["테치치화산","검은재 던전1 또는 2"],["타바스코화산","필드3 (펑키·레게·리젠트 오크)"],["심연","필드1 (분홍색 물고기·다이버)"]],"minePQ":{"head":["회차","스노우힐 5인 EXP","스노우힐 6인 EXP","테치치 5인 EXP","테치치 6인 EXP","타바스코 5인 EXP","타바스코 6인 EXP"],"rows":[["1회","58,733,940","72,592,510","61,408,719","75,898,417","64,083,498","79,204,324"],["2~4회 (각)","39,155,962","48,395,010","40,939,149","50,598,948","42,722,335","52,802,886"],["5회","55,470,946","68,559,596","57,997,127","71,681,842","60,523,307","74,804,088"],["6~9회 (각)","39,155,962","48,395,010","40,939,149","50,598,948","42,722,335","52,802,886"],["10회","52,207,949","64,526,678","54,585,530","67,465,262","56,963,112","70,403,846"],["11~14회 (각)","35,892,965","44,362,091","37,527,552","46,382,368","39,162,139","48,402,644"],["15회","48,944,950","60,493,760","51,173,934","63,248,682","53,402,916","66,003,605"],["16~19회 (각)","35,892,965","44,362,091","37,527,552","46,382,368","39,162,139","48,402,644"],["20회","45,681,953","56,460,841","47,762,337","59,032,102","49,842,721","61,603,363"],["21~24회 (각)","32,629,967","40,329,173","34,115,956","42,165,788","35,601,944","44,002,403"],["25회","65,259,935","80,658,347","68,231,912","84,331,577","71,203,889","88,004,807"],["26~29회 (각)","16,314,983","20,164,586","17,057,978","21,082,894","17,800,972","22,001,201"],["30회","97,889,902","120,987,520","102,347,868","126,497,365","106,805,833","132,007,210"],["합계","1,181,204,829","1,459,916,086","1,234,997,622","1,526,401,55 실험실 지도 · 음기의 결정 2","go":"phantom"},{"t":"환영학원 · 완성된 지도 사용 — 매드레이 실험실","x":"본관 1~3층 화장실 중 서프라이즈 스팟 발굴 → 균열 → 매드레이 처치 (워프 주의) 보상: 지아와 대화로 완료 → CR-100 교환","go":"phantom"},{"t":"혼돈의 탑","x":"혼돈의 탑(혼탑)은 1~72층과 체임버, 이후 진혼 층으로 이어지는 등반 콘텐츠입니다. 포푸리 서버에 구현되어 있습니다(서버 홍보글 기준). 입장 퀘스트 아이템 일부는 까발라 유적지에서 모읍니다. 1층에서 푸아로에게 출입증 발급 퀘스트를 받습니다. 층마다 비슷한 구성의 퀘스트가 있습니다: 에드의 흔적 찾기 → 다음 층 조사 → 숙련도 시험 → 혹독한 훈련 → 알바생의 '혼돈의 정수' 수집. 알바생 정수 퀘스트 보상 코드: S = 무기, A = 모자(투구), B = 방패, C = 포션 또는 혼돈 장비 랜덤 상자. 진혼 장비 파밍은 30층 추천(커뮤니티). 혼탑 보스는 대부분 땅(토)속성 공격 → 토속성 저항을 맞추면 받는 피해가 크게 줄어듭니다. 캐릭터 저항 한계는 70%. 정복을 빨리 할수록 매일 받는 경험치·아이템이 늘어납니다. 혼자 어느 정도 올리면 길드원 도움으로 정복하는 경우가 많습니다. 62층 정수 퀘스트: 1회 정수 50개 (3회 = 150개). 정수는 유저 거래 시세가 있어 직접 캐서 팔기도 합니다(시세는 서버마다 다름). 62층 정수 파밍 추천 직업(커뮤니티): 바람 양(바칼) ★★★★★, 듀얼리스트(뇌전·지진검) ★★★★★, 땅바람 정령사 ★★★, 물전기 정령사 ★★★. 72층 + 체임버 일일 반복 시 약 2,630만 EXP (정복 후, 커뮤니티 기준).","go":"chaos"},{"t":"1차 전직 (Lv.60 · TM Lv.50)","x":"까발라 유적지 키 퀘스트를 하다 보면 전직 레벨이 됩니다. 아래 재료를 모아 까발라 유적지 마을의 전직 NPC에게 가면 끝. 비용 30만 겔더 = 10만 겔더 수표 3장 (은행 수수료 5% 포함 31만 5천 겔더). 프리서버에서는 수표 1장을 전직 레벨 달성 시 우편으로 주기도 합니다(커뮤니티, 서버마다 다름).","go":"job"},{"t":"카드식별 (Lv.65)","x":"포푸리 동굴 2의 '호기심 포푸리'와 대화 → '신비의 공간'으로 이동. '하르콘에 갇힌 페어리 노노'에게 퀘스트를 받아 진행 (몬스터는 강하지 않음). 카드걸 퀘스트 보상 아르카나 카드(용기·지혜·꿈·사랑)가 필요합니다. 로즈가든까지 카드걸을 끝내면 다 모입니다. 하르콘 조각은 하르콘 유품에서 랜덤. 카드식별을 하면 아이템(포션·변신 액자·장비 강화 아이템 등)을 주니 인벤을 비우고 하세요. 낮은 확률로 각성에 필요한 시크릿 카드가 나옵니다.","go":"job"},{"t":"2차 전직 (Lv.130 · TM Lv.120)","x":"메갈로폴리스 스킬 마스터 정원의 '심판의 문'에서 퀘스트 수락 (왼쪽 발전형, 오른쪽 하이브리드, 붉은색 다크로드). 캐릭터별 전직 마스터를 찾아갑니다 (아래 표). 스노우힐 입구 '해피스토 스탤론' 퀘스트 완료. 스노우힐 광산(필드2) 안의 '대장장이 막스' 광물 수집 퀘스트 5회 → 보상 하르콘. 전직 마스터의 16관문 퀘스트 완료. 다시 심판의 문으로 가서 전직. 비용 300만 겔더 (100만 겔더 수표 3장, 수수료 포함 315만).","go":"job"},{"t":"영혼의 씨앗 (Lv.135 · 카드식별 완료)","x":"135레벨에 우편으로 받는 '의문의 편지'가 필요합니다. 버리지 마세요! 의문의 편지를 들고 신기루섬 필드7 '트릭스터 성전'으로. '빛나는 알'과 대화 → 네페트리와 대화 → 이크립스가 있는 장소로 이동. 이크립스와 대화하면 NPC들에게 이동됩니다. 미리 모은 아이템으로 퀘스트 완료 (아이템 이름이 모두 달라요). 네페트리에게 완료 → '포세이돈의 씨앗'. 사용 후 네페트리와 한 번 더 대화해 '차원의 카드팩'(시크릿 카드가 나옴)을 꼭 받으세요.","go":"job"},{"t":"각성 (Lv.180 · 2차 전직 · 카드식별 · 영혼의 씨앗 완료)","x":"시크릿 카드 16장(1~16번 1세트)으로 '비밀의 공간 지도'를 얻습니다. 카드식별로 모으거나 유저에게 구매합니다. 지도를 사용해 '미지의 힘이 부르는 곳'으로 — 보물지도 퀘스트처럼 상자 아이콘 위치를 1시간 안에 발굴. 퀘스트 진행. 거울을 보는 퀘스트는 자신의 도플갱어와 싸우니 장비를 모두 벗고 들어가세요. 메갈로폴리스 스킬 마스터 정원의 이클립스에게 완료 → '심안' 스킬 습득 (투명한 령 몬스터를 볼 수 있음).","go":"job"},{"t":"다크로드 수호석","x":"위 3번 단계까지 진행. 스노우힐 광산 '대장장이 막스'에게 퀘스트 받기. 2광구에서 벽을 뚫고 들어간 안쪽의 '???'에게 퀘스트 → '야누스의 가면' 1개 필요 (환영학원 별관 '몽마' 드랍, 개편 후에는 환영학원 입구 '겁쟁이수위 크레이븐'과 대화해 몽마 위치로 이동). 다시 막스에게: 티타늄 원석 5개 + 금록석 원석 5개 (1·2광구 발굴) → 빛의 알렉산드라이트·어둠의 알렉산드라이트. 이후 동일하게 진행.","go":"job"},{"t":"1~230레벨 진행 루트","x":"키 퀘스트와 에피소드 퀘스트를 같이 하며 올립니다. 키 퀘스트만 하면 닐스 야영지까지 해도 다음 키퀘 제한(230)에 못 미쳐 뜹니다. 사냥만으로 올리는 건 효율이 낮습니다. TM 레벨은 120 또는 180부터 드릴군 + 그 레벨대 탱크드릴로 주력 스킬 마스터까지 먼저 올리는 것을 추천 (총 감지력 90 이상, 드릴군 100 준비). 메갈로폴리스 티프몽 판매 품목 중 '얼음 드릴'은 늪지대 필드까지 쓸 수 있는 가성비 드릴입니다.","go":"guide"},{"t":"돈 문제 해결 (초중반)","x":"1차 전직 30만 겔더는 퀘스트 아이템을 사지 않으면 자연히 모입니다. 2차 전직 300만 겔더는 로즈가든 화원 퀘스트 보상 '관 속 마녀의 빗자루' 3개를 유저에게 팔면 마련됩니다. 하르콘은 사지 말고 스노우힐~타바스코 광산 막스 퀘스트 5회 보상으로 (경험치도 줌). 카드 파밍: 노라 하수관 노라 비그 고정 젠존이나 코라비치 배드퓨리 존에서 몬스터 카드를 모아 카드식별 하는 유저에게 판매. 각성용 시크릿 카드 세트는 카드식별로 직접 모으거나 구매. 각성 후 심안으로 령 몬스터를 사냥하면 수입이 좋아집니다.","go":"guide"},{"t":"230~400레벨 진행","x":"230 타바스코 키퀘를 마치면 테마탕은 어려우니 혼돈의 탑 입장 퀘스트 후 등반이 일반적입니다. 각성 후 령퀘는 매일 꾸준히 — 경험치가 큽니다. 별점이 3장인 날은 드롭 카드를 붙이고 령사(령 몬스터 사냥)를 하세요. 광산 파티 퀘스트(스노우힐 200 · 테치치 230 · 타바스코 260)가 시간 대비 경험치가 매우 좋습니다. 보통 5인팟, 첫 판·마지막 판은 6인. 피에스타는 원킬이 나는 스펙일 때 참여하세요. 몬스터가 한 방에 안 죽으면 강한 스킬(마법 봉인 30초 등)을 씁니다. 키퀘·파티퀘·혼탑 정복·령퀘를 매일 하면 320은 넘고, 이후는 일일 퀘스트로 꾸준히 올립니다.","go":"guide"},{"t":"퀘스트 효율 체크","x":"테마탕 4층 조합 퀘스트(번데기탕 10개)는 재료 시세 대비 경험치가 62층 정수 퀘스트보다 훨씬 비쌉니다 — 효율상 비추천. 에피소드 보너스의 '개발자 사진 2호' 퀘스트는 장당 시세가 매우 비싸 비추천.","go":"guide"},{"t":"알아두면 좋은 것","x":"중간 장비는 직접 만드는(직작) 쪽이 대체로 쌉니다. 방패는 230제 진혼의 수정방패를 직접 만들어 보는 것을 추천. 경매장이 없고 시세 기능은 업데이트마다 초기화되니 참고만. 파티 버그: 처음 파티를 만들 때 레벨 차이 50 이상이면 '경험치 분배 없음'이 안 눌리는 경우, 파티 경험치 보너스가 가끔 사라지는 경우가 있습니다 (포탈 왕복으로 해결).","go":"guide"},{"t":"장비 · 1차 전직 뱃지 (60제)","x":"카붐(까발라 지하던전4, Lv.80) 드랍. 캐릭터별 뱃지, 거래 가능 function imgKeys(name){const out=[];const add=s=>{s=norm(s);if(s&&!out.includes(s))out.push(s)};let s=String(name??'');add(s);
  s=s.replace(/\s*\(.*?\)\s*/g,' ').trim();add(s);

const CY_HANGUL=/[\uac00-\ud7a3]/, CY_WORD=/[0-9A-Za-z\uac00-\ud7a3]/;
function cyClean(s){s=String(s||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();s=s.replace(/^[!★☆*#\s]+/,'');s=s.replace(/^\d+\s*[xX×]\s*/,'');

  walk(el);flush();return toks}
function cyParse(html){const doc=new DOMParser().parseFromString(html,'text/html');const pairs=[];const lines=el=>el?cyTokens(el).filter(t=>t.t).map(t=>t.t):[];
  for(const cell of doc.querySelectorAll('td,th')){if(!cell.querySelector('img')||cell.querySelector('td,th'))continue;const groups=[];let g=null;
    for(const tk of cyTokens(cell)){if(tk.img){if(!g||g.lines.length){g={imgs:[],lines:[]};groups.push(g)}g.imgs.push(tk.img)}else if(g)g.lines.push(tk.t)}

      const ko=ls.filter(l=>CY_HANGUL.test(l)).map(cyClean).filter(Boolean);const en=ls.filter(l=>!CY_HANGUL.test(l)&&/[A-Za-z]{2}/.test(l)).map(x=>x.trim());
      gr.imgs.forEach((im,i)=>{const src=im.getAttribute('src')||'';if(!/^https:\/\/(blogger\.googleusercontent\.com|[0-9a-z.]*bp\.blogspot\.com)\//.test(src))return;
        const one=gr.imgs.length===1;const names=one?ko:(ko[i]?[ko[i]]:[]);const ens=one?en.slice():(en[i]?[en[i]]:[]);if(im.alt)ens.push(im.alt);
        if(names.length||ens.length)pairs.push({src,names,ens})})}}

function jsonp(url,ms=20000){return new Promise(res=>{const cb='__a2o'+Math.random().toString(36).slice(2);const s=document.createElement('script');let t=0;

function knownNames(){if(KNOWN)return KNOWN;const k=new Set();const add=n=>{for(const x of imgKeys(n))k.add(x)};

function imgUrl(name,kind,en){const mk=kind+'|'+name;if(IMG.memo.has(mk))return IMG.memo.get(mk);let url='',feed='';

      url=best[1].startsWith('g:')?GUC+best[1].slice(2):best[1];feed=best[0];break}}

function srcGroups(it){const out=[];let dig=false;
  for(const t of srcTokens(it.src)){const m=monFind(t);if(m){out.push({key:'m:'+m.n,type:'m',name:m.n,mon:m});continue}
    if(/발굴/.test(t))dig=true;else if(/상점|구입/.test(t))out.push({key:'s:'+(it.loc||t),type:'s',name:it.loc||t});else out.push({key:'o:'+t,type:'o',name:t})}
  if(dig)out.push({key:'d:'+(it.loc||'위치 정보 없음'),type:'d',name:it.loc||'위치 정보 없음'});if(!out.length)out.push({key:'o:?',type:'o',name:'얻는 곳 정보 없음'});
  const seen=new Set();return out.filter(g=>!seen.has(g.key)&&seen.add(g.key))}

    for(const g of srcGroups(it)){if(!G.has(g.key))G.set(g.key,Object.assign(g,{rows:[]}));G.get(g.key).rows.push({q,it,h})}}
  const ord={m:0,d:1,s:2,o:3};groups=[...G.values()].sort((a,b)=>ord[a.type]-ord[b.type]||b.rows.length-a.rows.length||((a.mon&&a.mon.lv)||999)-((b.mon&&b.mon.lv)||999));

    return `<div class="fr${isOn(u.q.id)?' on':''}"><div><div class="tqt"><span class="chip soft">${esc(CAT[u.q.cat]||'')}</span><button type="button" class="ent ttl" data-qview="${esc(u.q.id)}">${esc(u.q.title)}</button><span class="mut">${esc(u.q.sub||'')}</span></div><div class="qn">필요 <b>×${esc(u.x.label||u.x.need)}</b>${isOn(u.q.id)&&it?` · 모은 개수 ${h}/${it.need}`:''}</div></div>${qBtn(u.q.id)}</div>`}).join('')}</div>`:''}

function settingsHtml(){return `<h2>설정</h2>
  <div class="sec"><h3>화면 테마</h3><div class="pills" role="group" aria-label="테마">${[['auto','기기 설정 따라'],['light','밝게'],['dark','어둡게']].map(([k,v])=>`<button type="button" class="pill${SET.theme===k?' on':''}" data-themeset="${k}">${v}</button>`).join('')}</div></div>

/* ================= copy / backup / share ================= */
let toastT=0;function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}
async function copyText(text,msg='복사했어요. 카톡이나 디스코드에 붙여 넣으세요'){try{await navigator.clipboard.writeText(text);toast(msg);return}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();
  if(ok)toast(msg);else openModal({t:'code',html:`<h2>복사하기</h2><p class="mut">자동 복사가 막혀 있어요. 아래 내용을 길게 눌러 복사하세요.</p><textarea rows="10" readonly>${esc(text)}</textarea>`})}
const b64e=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s+/g,'')),c=>c.charCodeAt(0)));
function backupCode(){return 'A2O1:'+b64e(JSON.stringify({track:TR,set:SET,lv:S.lv,season:store.get('season',null),done:store.get('done:'+today(),{}),at:Date.now()}))}
function shareCode(){return 'A2OQ:'+b64e(JSON.stringify(TR.active.map(a=>a.id).filter(id=>!id.startsWith('cu:'))))}
function importCode(raw){const s=String(raw||'').trim();try{
  if(s.startsWith('A2OQ:')){const ids=JSON.parse(b64d(s.slice(5)));let n=0;for(const id of [].concat(ids).reverse())if(addQ(String(id),true))n++;toast(n?`퀘스트 ${n}개를 내 퀘스트에 넣었어요`:'이미 다 들어 있는 퀘스트예요');return true}
  if(s.startsWith('A2O1:')){const o=JSON.parse(b64d(s.slice(5)));if(!o||!o.track||!Array.isArray(o.track.active))throw 0;store.set('track:bak',TR);
    for(const k of Object.keys(TR))delete TR[k];Object.assign(TR,o.track);if(!TR.day||TR.day.d!==today())TR.day={d:today(),p:{}};for(const k of ['active','log','custom'])if(!Array.isArray(TR[k]))TR[k]=[];if(!TR.prog)TR.prog={};
    if(o.set)Object.assign(SET,o.set);saveSet();applyTheme();if(o.lv!=null){S.lv=o.lv;store.set('lv',o.lv)}if(o.done&&o.at&&new Date(o.at).toDateString()===new Date().toDateString())store.set('done:'+today(),o.done);
    saveTR();buildCatalog();buildIndex();toast(`백업을 불러왔어요 · 진행 중 ${TR.active.length}개`);return true}}catch(e){}
  toast('코드를 읽지 못했어요. 처음부터 끝까지 다 붙여 넣었는지 확인해 주세요');return false}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}

/* ================= events ================= */
function rerender(){const a=document.activeElement;let sel=null;
  if(a&&a.dataset)for(const k of ['tk','tn','ts','qtoggle','qmove','fqcat','qall','done']){if(a.dataset[k]!=null){sel=`[data-${k}="${CSS.escape(a.dataset[k])}"]`;break}}
  const inModal=!!(a&&a.closest&&a.closest('.ov'));route();if(sel){const root=inModal?$('.ov'):$('#view');const el=root&&root.querySelector(sel);if(el)try{el.focus({preventScroll:true})}catch(e){}}}
function splitT(v){const a=v.indexOf('|');return[v.slice(0,a),v.slice(a+1)]}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.tk!=null){const[qid,k]=splitT(t.dataset.tk);const[q,it]=findIt(qid,k);if(it){change(q,it,t.checked?Math.max(it.need,haveOf(q,it)):0);keepRows(rerender)}return}
  if(t.dataset.tn!=null){const[qid,k]=splitT(t.dataset.tn);const[q,it]=findIt(qid,k);if(it){change(q,it,t.value);keepRows(rerender)}return}
  if(t.dataset.done!=null){const k='done:'+today(),o=store.get(k,{});if(t.checked)o[t.dataset.done]=true;else delete o[t.dataset.done];store.set(k,o);const c=t.closest('.dq,.rep');if(c)c.classList.toggle('is-done',t.checked);
    if(!$('.ov'))rerender();return}
  if(t.id==='mylv'){S.lv=t.value;store.set('lv',t.value);route();return}
  if(['monReg','monSort','specReg','qiCtx'].includes(t.id)){S.monLimit=60;route();return}
  if(t.id==='fqReg'||t.id==='fqFit'||t.id==='fqOn'){if(t.id==='fqReg')S.fq.reg=t.value;if(t.id==='fqFit')S.fq.fit=t.checked;if(t.id==='fqOn')S.fq.hideOn=t.checked;S.fqLimit=40;store.set('fq',S.fq);route();return}
  if(t.id==='setHide'||t.id==='setHide2'){SET.hideDone=t.checked;saveSet();rerender();return}if(t.id==='setLast'||t.id==='setLast2'){SET.doneLast=t.checked;saveSet();rerender();return}
  if(t.id==='setImg'){SET.imgs=t.checked;saveSet();if(SET.imgs)imgInit();route();imgStatus();return}
  if(t.id==='bkFile'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{if(importCode(String(fr.result)))route()};fr.readAsText(t.files[0]);t.value='';return}});
document.addEventListener('submit',e=>{if(e.target.id!=='cuForm')return;e.preventDefault();const title=$('#cuT').value.trim();if(!title){$('#cuT').focus();return}
  const items=$('#cuI').value.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[\s×xX*]+(\d+)\s*개?$/);return m&&m[1].trim()?{n:m[1].trim(),need:Math.min(99999,+m[2])||1}:{n:l,need:1}}).slice(0,60);
  if(!items.length){toast('재료를 한 줄에 하나씩 적어 주세요');$('#cuI').focus();return}
  const id='cu:'+Date.now().toString(36);TR.custom.push({id,title,items});buildCatalog();buildIndex();addQ(id,true);saveTR();toast(`‘${title}’ 퀘스트를 만들었어요`);location.hash='my'});
document.addEventListener('click',e=>{const t=e.target;let b;
  if((b=t.closest('[data-go]'))){e.preventDefault();closeModal();$('#q').value='';const was=location.hash;location.hash=b.dataset.go;if(was===location.hash)route();window.scrollTo({top:0});return}
  if((b=t.closest('[data-ent]'))){e.preventDefault();const v=b.dataset.ent,i=v.indexOf('|');openEnt(v.slice(0,i),v.slice(i+1));return}
  if((b=t.closest('[data-qview]'))){e.preventDefault();openQuest(b.dataset.qview);return}
  if((b=t.closest('[data-confirm]'))){e.preventDefault();if(!b.dataset.armed){b.dataset.armed='1';b.dataset.label=b.textContent;b.textContent='정말요? 한 번 더 누르세요';b.classList.add('warn');
      setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label}},4000);return}
    const v=b.dataset.confirm,i=v.indexOf('|'),act=i<0?v:v.slice(0,i),arg=i<0?'':v.slice(i+1);
    if(act==='reset'){resetQ(arg);toast('체크를 처음부터 다시 시작해요')}
    else if(act==='cudel'){delQ(arg);delete TR.prog[arg];TR.custom=TR.custom.filter(c=>c.id!==arg);saveTR();buildCatalog();buildIndex();toast('직접 만든 퀘스트를 삭제했어요')}
    else if(act==='clearlog'){TR.log=[];saveTR();toast('완료 기록을 지웠어요')}
    else if(act==='wipe'){store.set('track:bak',TR);TR.active=[];TR.prog={};TR.day={d:today(),p:{}};TR.log=[];saveTR();toast('내 퀘스트를 비웠어요')}
    rerender();return}
  if((b=t.closest('[data-qtoggle]'))){const id=b.dataset.qtoggle;if(isOn(id)){delQ(id);toast('내 퀘스트에서 뺐어요 (체크 기록은 남아 있어요)')}else addQ(id);rerender();return}
  if((b=t.closest('[data-ts]'))){const v=b.dataset.ts,a=v.indexOf('|'),z=v.lastIndexOf('|');const[q,it]=findIt(v.slice(0,a),v.slice(a+1,z));if(it){change(q,it,haveOf(q,it)+(+v.slice(z+1)));keepRows(rerender)}return}
  if((b=t.closest('[data-qmove]'))){const[id,d]=splitT(b.dataset.qmove);moveQ(id,+d);rerender();return}
  if((b=t.closest('[data-qall]'))){const q=QBY[b.dataset.qall];if(q){const was=stat(q).done;const bx=box(q,true);for(const it of q.items)bx[it.k]=Math.max(it.need,bx[it.k]||0);saveTR();if(!was)toast(`🎉 ‘${q.title}’ 모두 체크했어요`)}rerender();return}
  if((b=t.closest('[data-qdone]'))){finishQ(b.dataset.qdone);rerender();return}
  if((b=t.closest('[data-qcopy]'))){const q=QBY[b.dataset.qcopy];if(q)copyText(questText([q]));return}
  if(t.closest('[data-qcopyall]')){copyText(questText(TR.active.map(a=>QBY[a.id]).filter(Boolean)));return}
  if(t.closest('[data-farmcopy]')){copyText(farmText());return}
  if(t.closest('[data-share]')){const c=shareCode();openModal({t:'code',html:`<h2>퀘스트 목록 공유 코드</h2><p class="mut">길드원에게 이 코드를 보내면, 받은 사람이 ⚙ 설정 → ‘붙여 넣은 코드 불러오기’로 같은 퀘스트들을 자기 내 퀘스트에 넣을 수 있어요. 체크 기록은 들어가지 않아요.</p><textarea rows="4" readonly>${esc(c)}</textarea><button type="button" class="tb go" data-copycode="${esc(c)}">코드 복사</button>`});return}
  if((b=t.closest('[data-copycode]'))){copyText(b.dataset.copycode,'코드를 복사했어요');return}
  if((b=t.closest('[data-sethide]'))){SET.hideDone=b.dataset.sethide==='1';saveSet();rerender();return}
  if((b=t.closest('[data-fqcat]'))){S.fq.cat=b.dataset.fqcat;S.fqLimit=40;store.set('fq',S.fq);rerender();return}
  if(t.closest('[data-fqmore]')){S.fqLimit+=40;route();return}
  if((b=t.closest('[data-season]'))){S.season=b.dataset.season;store.set('season',S.season);buildCatalog();buildIndex();route();return}
  if((b=t.closest('[data-itab]'))){S.itemTab=b.dataset.itab;route();return}
  if(t.closest('[data-more]')){S.monLimit+=60;route();return}
  if((b=t.closest('[data-themeset]'))){SET.theme=b.dataset.themeset;saveSet();applyTheme();refreshModal();return}
  if(t.closest('[data-imgreload]')){store.del('img');IMG.ready=false;IMG.map={};IMG.memo.clear();IMG.state='idle';SET.imgs=true;saveSet();imgInit(true);refreshModal();return}
  if((b=t.closest('[data-backup]'))){const k=b.dataset.backup;if(k==='copy')copyText(backupCode(),'백업 코드를 복사했어요. 다른 기기의 설정 화면에 붙여 넣으세요');
    else if(k==='file')download(`A2O-내퀘스트-백업-${today()}.txt`,backupCode());
    else if(k==='paste'){const v=($('#bkCode')||{}).value||'';if(importCode(v)){closeModal();route()}}return}
  if(t.closest('#setBtn')){openModal({t:'set'});return}
  if(t.closest('#totop')){window.scrollTo({top:0,behavior:'smooth'});return}});
let ft=null;document.addEventListener('input',e=>{const t=e.target;
  if(['monQ','qiQ','specQ','cardQ','fqQ'].includes(t.id)){clearTimeout(ft);S.monLimit=60;if(t.id==='fqQ'){S.fq.q=t.value;S.fqLimit=40;store.set('fq',S.fq)}const id=t.id,pos=t.selectionStart;
    ft=setTimeout(()=>{route();const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}},200)}});
let st=null;$('#q').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>{const v=$('#q').value.trim();if(v){$('#view').innerHTML=vSearch(v)}else route()},200)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.ov')){closeModal();return}if($('#q').value&&document.activeElement===$('#q')){$('#q').value='';route()}return}
  if(e.key==='/'&&!$('.ov')&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')){e.preventDefault();$('#q').focus();return}
  if(e.key==='Tab'&&$('.ov')){const f=[...$('.ov').querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}});
window.addEventListener('scroll',()=>{const b=$('#totop');if(b)b.hidden=window.scrollY<700},{passive:true});
setInterval(()=>{if(rollDay()){route();toast('날짜가 바뀌어 매일 퀘스트 체크가 초기화됐어요')}const r=$('#rst');if(r)r.textContent=resetLeft()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&rollDay())route()});
window.addEventListener('storage',e=>{if(e.key==='a2o:track'&&e.newValue){try{const o=JSON.parse(e.newValue);for(const k of Object.keys(TR))delete TR[k];Object.assign(TR,o);buildCatalog();buildIndex();route()}catch(_){}}});

/* ================= router / boot ================= */
function route(){if(!D)return;rollDay();const h=decodeURIComponent((location.hash||'#home').slice(1));let active=h,html='';
  if(h.startsWith('share=')){importCode(h.slice(6));history.replaceState(null,'','#my');return route()}
  if(h.startsWith('r-')){active='region';html=vRegion(h.slice(2))}
  else if(h==='my'||h.startsWith('my-')){active='my';html=vMy(h.slice(3)||'now')}
  else{const V={home:vHome,daily:vDaily,episode:vEpisode,job:vJob,tartarus:vTartarus,chaos:vChaos,phantom:vPhantom,cards:vCards,monsters:vMonsters,items:vItems,mines:vMines,gear:vGear,guide:vGuide,sources:vSources,region:()=>vRegion(S.region)};
    if(!V[h])active='home';html=(V[h]||vHome)()}
  nav(active);badge();const q=$('#q').value.trim();$('#view').innerHTML=q?vSearch(q):html;
  $('#foot').innerHTML=`A2O 길드 전용 자료실 · 포푸리 서버 · 자료 정리 ${esc(D.meta.built)} · <a href="#sources" data-go="sources">출처 보기</a><br>몬스터·아이템·NPC 그림: <a href="https://livehepa.blogspot.com/p/trickster-online.html" target="_blank" rel="noopener">CYAN's GAME BLOG</a> (그림의 권리는 원작자와 게임사에 있어요) · 단축키: / 검색, Esc 닫기`;
  refreshModal()}
window.addEventListener('hashchange',()=>{$('#q').value='';closeModal();route()});
function boot(){store.del('pw');$('#view').innerHTML='<p class="empty">자료를 불러오는 중…</p>';
  try{D=JSON.parse(document.getElementById('a2o-data').textContent);for(const s of D.sources)SRC[s.id]=s;buildCatalog();buildIndex();imgInit();route()}
  catch(e){console.error(e);$('#view').innerHTML='<p class="empty">자료 파일을 불러오지 못했어요. 새로고침해 주세요.</p>'}}
boot();
}

</script>
